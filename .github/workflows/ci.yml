name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack --no-build --configuration Release --output artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nuget-package
          path: artifacts/*.nupkg

  # Builds the image from the Dockerfile and uses it the way the wiki describes (Standalone Server, "Docker")
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t rony .

      - name: Write the configuration of the wiki's Docker example
        run: |
          mkdir mock
          cat > mock/mock.json <<'JSON'
          { "version": 1, "server": { "address": "0.0.0.0", "port": 4000 }, "rules": [ { "request": "PING", "reply": "PONG" } ] }
          JSON

      - name: Validate the configuration in a container
        run: docker run --rm -v "$PWD/mock:/config:ro" rony validate /config/mock.json

      - name: Run the server in a container and talk to it
        run: |
          docker run -d --name rony -p 127.0.0.1:4000:4000 -v "$PWD/mock:/config:ro" rony
          for attempt in $(seq 1 30); do
            docker logs rony 2>&1 | grep -q "Listening on" && break
            sleep 1
          done
          docker logs rony
          docker logs rony 2>&1 | grep -q "Listening on tcp 0.0.0.0:4000"

          exec 3<>/dev/tcp/127.0.0.1/4000
          printf 'PING' >&3
          read -t 10 -r -n 4 reply <&3
          exec 3>&-
          echo "reply: $reply"
          [ "$reply" = "PONG" ]

      - name: The container runs as a non-root user and stops cleanly on SIGTERM
        run: |
          [ "$(docker exec rony id -u)" != "0" ]
          docker stop rony
          docker logs rony
          [ "$(docker inspect --format '{{.State.ExitCode}}' rony)" = "0" ]

      - name: The control endpoint is reachable in a container
        run: |
          docker run -d --name rony-control -p 127.0.0.1:4000:4000 -p 127.0.0.1:4001:4001 -v "$PWD/mock:/config:ro" rony \
            run /config/mock.json --control 4001 --control-address 0.0.0.0
          for attempt in $(seq 1 30); do
            docker logs rony-control 2>&1 | grep -q "Control on" && break
            sleep 1
          done
          docker logs rony-control
          docker logs rony-control 2>&1 | grep -q "Warning: the control endpoint on 0.0.0.0 has no authentication"
          docker logs rony-control 2>&1 | grep -q "Control on 0.0.0.0:4001"

          exec 3<>/dev/tcp/127.0.0.1/4000
          printf 'PING' >&3
          read -t 10 -r -n 4 reply <&3
          exec 3>&-
          [ "$reply" = "PONG" ]

          exec 4<>/dev/tcp/127.0.0.1/4001
          printf '{"command":"requests"}\n' >&4
          read -t 10 -r control_reply <&4
          exec 4>&-
          echo "control reply: $control_reply"
          echo "$control_reply" | grep -q '"ok":true'
          echo "$control_reply" | grep -q '"text":"PING"'
          docker stop rony-control

      - name: The Docker Compose example of the wiki works
        run: |
          set -euo pipefail
          cat > compose.yaml <<'YAML'
          services:
            mock:
              image: rony
              command: ["run", "/config/mock.json"]
              volumes:
                - ./mock:/config:ro
            client:
              image: busybox
              depends_on: [mock]
              command:
                - sh
                - -c
                - |
                  for attempt in $$(seq 1 20); do
                    reply=$$( (printf PING; sleep 2) | nc -w 5 mock 4000 || true)
                    [ "$$reply" = "PONG" ] && break
                    sleep 1
                  done
                  echo "reply: $$reply"
                  [ "$$reply" = "PONG" ]
          YAML
          status=0
          docker compose up --exit-code-from client --abort-on-container-exit || status=$?
          docker compose logs
          docker compose down
          exit "$status"

      - name: The image builds for linux/amd64 and linux/arm64 without emulation
        run: |
          set -euo pipefail
          # A separate builder (docker-container driver); the loaded image above came from the default builder.
          docker buildx create --name multi --use
          docker buildx build --builder multi --platform linux/amd64,linux/arm64 .
