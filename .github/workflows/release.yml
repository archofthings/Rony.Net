name: Release

# Publishes to NuGet and creates a GitHub release when a version tag (for example v1.0.0) is pushed.
# Requires a repository secret named NUGET_API_KEY.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check the tag matches the package version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/Rony/Rony.csproj)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version $version" >&2
            exit 1
          fi

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack src/Rony/Rony.csproj --configuration Release --output artifacts

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
