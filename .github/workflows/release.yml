name: Release

# Publishes to NuGet and creates a GitHub release when a version tag (for example v1.0.0) is pushed.
# Uses NuGet Trusted Publishing: no long-lived API key is stored. It needs
#   - a Trusted Publishing policy on nuget.org for archofthings/Rony.Net and this file (release.yml)
#   - a repository secret named NUGET_USER holding the nuget.org profile name (not the email address)
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # let NuGet/login exchange a GitHub OIDC token for a short-lived NuGet API key

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check the tag matches every package version
        run: |
          for project in src/*/*.csproj; do
            version=$(grep -oP '(?<=<Version>)[^<]+' "$project")
            if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match version $version of $project" >&2
              exit 1
            fi
          done

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        # Rony.Net, Rony.Net.Xunit, Rony.Net.NUnit and Rony.Net.MSTest; test and sample projects are not packable
        run: dotnet pack --configuration Release --output artifacts

      - name: Log in to NuGet (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
